# This workflow will run tests using node and then publish a package to npm

name: Generate SDK and Publish to npm

on:
  push:
    branches:
      - main
      - release/*

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate SDK from OpenAPI
        run: |
          echo "Generating TypeScript SDK from https://alpha.api.fiber.ai/openapi.json..."
          npm run generate
          echo "SDK generated successfully"

      - name: Build SDK
        run: |
          echo "Building SDK..."
          npm run build
          echo "SDK built successfully"

      - name: Type check
        run: npm run typecheck

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
